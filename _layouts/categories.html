---
layout: default
title: Categories
---
<div class="categories-page">
  <h1>Categories</h1>
  {% for category in site.categories %}
  <div class="category-section">
    <h2 id="{{ category[0] }}">{{ category[0] }}</h2>
    <ul>
      {% for post in category[1] %}
      <li>
        <a href="{{ post.url }}">{{ post.title }}</a>
        <span>{{ post.date | date: "%B %d, %Y" }}</span>
      </li>
      {% endfor %}
    </ul>
  </div>
  {% endfor %}
</div>
