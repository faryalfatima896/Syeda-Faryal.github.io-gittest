<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang }}">

{% include head.html %}

<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=DM+Sans:wght@300;400;500&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'DM Sans', sans-serif;
  background: #0f0f1a;
  color: #F0EFF8;
  min-height: 100vh;
}

.site-header {
  background: rgba(15,15,26,0.95);
  border-bottom: 1px solid rgba(127,119,221,0.2);
  padding: 1.2rem 3rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: sticky;
  top: 0;
  z-index: 100;
}

.site-title {
  font-family: 'Playfair Display', serif;
  font-size: 18px;
  font-weight: 600;
  color: #F0EFF8;
  text-decoration: none;
  letter-spacing: 0.3px;
}

.site-nav {
  display: flex;
  gap: 2rem;
  list-style: none;
}

.site-nav a {
  font-size: 13.5px;
  color: #6b6a7a;
  text-decoration: none;
  letter-spacing: 0.4px;
  font-weight: 400;
  transition: color 0.2s;
}

.site-nav a:hover { color: #AFA9EC; }

.page-content {
  max-width: 960px;
  margin: 0 auto;
  padding: 3rem 2rem;
}

/* ===== ABOUT & OTHER PAGES DARK STYLING ===== */
h1, h2, h3 {
  color: #F0EFF8;
}

h1 a, h2 a {
  color: #AFA9EC !important;
  text-decoration: none;
}

p, li {
  color: #9998aa;
}

a {
  color: #AFA9EC;
}

/* About page sections */
.about-intro { color: #9998aa !important; }
.about-intro span { color: #F0EFF8 !important; }

.section-heading {
  color: #F0EFF8 !important;
  border-bottom: 1px solid rgba(127,119,221,0.2) !important;
}

.about-card {
  background: #1a1a2e !important;
  border: 1px solid rgba(127,119,221,0.2) !important;
}

.about-card-value { color: #E8E7F5 !important; }
.about-card-desc { color: #6b6a7a !important; }

.skill-pill {
  background: rgba(127,119,221,0.15) !important;
  color: #AFA9EC !important;
}

.project-card {
  background: #1a1a2e !important;
  border: 1px solid rgba(127,119,221,0.2) !important;
  border-left: 3px solid #7F77DD !important;
}

.project-title { color: #E8E7F5 !important; }
.project-desc { color: #9998aa !important; }

.fun-facts li {
  color: #9998aa !important;
  border-bottom: 1px solid rgba(127,119,221,0.1) !important;
}

.introvert-box {
  background: rgba(127,119,221,0.1) !important;
  border-left: 3px solid #7F77DD !important;
  color: #AFA9EC !important;
}

/* Contact page */
.contact-intro { color: #9998aa !important; }

.contact-card {
  background: #1a1a2e !important;
  border: 1px solid rgba(127,119,221,0.2) !important;
  color: #E8E7F5 !important;
}

.contact-card:hover {
  border-color: rgba(127,119,221,0.5) !important;
}

.contact-card-value { color: #E8E7F5 !important; }
.contact-note { color: #3C3A55 !important; }

.site-footer {
  background: #12121f;
  border-top: 1px solid rgba(127,119,221,0.15);
  padding: 1.4rem 3rem;
  text-align: center;
  font-size: 12.5px;
  color: #3C3A55;
  margin-top: 4rem;
}
</style>

<body>

  <header class="site-header">
    <a class="site-title" href="{{ site.baseurl }}/">{{ site.title }}</a>
    <nav>
      <ul class="site-nav">
        {% for item in site.menu %}
        <li><a href="{{ site.baseurl }}{{ item.url }}">{{ item.title }}</a></li>
        {% endfor %}
      </ul>
    </nav>
  </header>

  <main class="page-content">
    {{ content }}
  </main>

  <footer class="site-footer">
    &copy; {{ site.time | date: "%Y" }} Syeda Faryal Fatima Naqvi &middot; All rights reserved
  </footer>

</body>
</html>
