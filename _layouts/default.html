<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang }}">

{% include head.html %}

<style>
  /* ===== GOOGLE FONT IMPORT ===== */
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap');

  /* ===== PARTICLES BACKGROUND ===== */
  #particles-js {
    position: fixed;
    width: 100%;
    height: 100%;
    top: 0;
    left: 0;
    z-index: -1;
    background: #0f0c29;
    background: linear-gradient(to right, #24243e, #302b63, #0f0c29);
  }

  /* ===== BODY ===== */
  body {
    position: relative;
    z-index: 1;
    font-family: 'Poppins', sans-serif !important;
    color: #FF69B4 !important;
  }

  /* ===== HEADINGS ===== */
  h1, h2, h3, h4, h5, h6 {
    font-family: 'Poppins', sans-serif !important;
    color: #FF1493 !important;
    font-weight: 700 !important;
  }

  /* ===== PARAGRAPHS & TEXT ===== */
  p, li, span, div {
    font-family: 'Poppins', sans-serif !important;
    color: #FF69B4 !important;
  }

  /* ===== HOVER ANIMATIONS ON LINKS ===== */
  a {
    position: relative;
    color: #FF69B4 !important;
    text-decoration: none !important;
    transition: color 0.3s ease !important;
  }

  a::after {
    content: '';
    position: absolute;
    width: 0%;
    height: 2px;
    bottom: -2px;
    left: 0;
    background-color: #FF69B4;
    transition: width 0.3s ease;
    box-shadow: 0 0 8px #FF1493;
  }

  a:hover::after {
    width: 100%;
  }

  a:hover {
    color: #ffffff !important;
    text-shadow: 0 0 10px #FF69B4, 0 0 20px #FF1493 !important;
    letter-spacing: 1px !important;
    transition: all 0.3s ease !important;
  }

  /* ===== SCROLL FADE-IN ANIMATION ===== */
  .fade-in-element {
    opacity: 0;
    transform: translateY(30px);
    transition: opacity 0.7s ease, transform 0.7s ease;
  }

  .fade-in-element.visible {
    opacity: 1;
    transform: translateY(0);
  }
</style>

<body>

  <!-- Particles Background -->
  <div id="particles-js"></div>

  <header class="hover smooth">
    {% unless site.show_minimal and site.navigation and site.external %}
      <h1 {% if site.navigation and site.external %}class="full"{% endif %}>
        <a href="{{ "/" | relative_url }}">{{ site.title | escape }}</a>
      </h1>
    {% endunless %}
    {% include menu.html %}
  </header>

  {{ content }}

  {%- if site.footer -%}
  <footer class="hover">
    <div>{{ site.description }}</div>
  </footer>
  {%- endif -%}

  <!-- Particles JS -->
  <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
  <script>
    particlesJS("particles-js", {
      particles: {
        number: { value: 80, density: { enable: true, value_area: 800 } },
        color: { value: "#FF69B4" },
        shape: { type: "circle" },
        opacity: { value: 0.5, random: true },
        size: { value: 3, random: true },
        line_linked: {
          enable: true,
          distance: 150,
          color: "#FF69B4",
          opacity: 0.4,
          width: 1
        },
        move: {
          enable: true,
          speed: 3,
          direction: "none",
          random: false,
          straight: false,
          out_mode: "out"
        }
      },
      interactivity: {
        detect_on: "canvas",
        events: {
          onhover: { enable: true, mode: "repulse" },
          onclick: { enable: true, mode: "push" }
        },
        modes: {
          repulse: { distance: 100 },
          push: { particles_nb: 4 }
        }
      },
      retina_detect: true
    });
  </script>

  <!-- Scroll Fade-In Animation -->
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const targets = document.querySelectorAll('h1, h2, h3, p, a, li, div, span, footer');
      targets.forEach((el, i) => {
        el.classList.add('fade-in-element');
        el.style.transitionDelay = (i * 0.05) + 's';
      });

      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add('visible');
          }
        });
      }, { threshold: 0.1 });

      document.querySelectorAll('.fade-in-element').forEach(el => {
        observer.observe(el);
      });
    });
  </script>

</body>
</html>
