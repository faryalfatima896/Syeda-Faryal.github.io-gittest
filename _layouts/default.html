<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang }}">

{% include head.html %}

<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=DM+Sans:wght@300;400;500&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'DM Sans', sans-serif;
  background: #FAFAF8;
  color: #2C2C2A;
  min-height: 100vh;
}

/* ===== NAVBAR ===== */
.site-header {
  background: #ffffff;
  border-bottom: 1px solid #E8E6E0;
  padding: 1.2rem 3rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: sticky;
  top: 0;
  z-index: 100;
}

.site-title {
  font-family: 'Playfair Display', serif;
  font-size: 18px;
  font-weight: 600;
  color: #2C2C2A;
  text-decoration: none;
  letter-spacing: 0.3px;
}

.site-nav {
  display: flex;
  gap: 2rem;
  list-style: none;
}

.site-nav a {
  font-size: 13.5px;
  color: #888780;
  text-decoration: none;
  letter-spacing: 0.4px;
  font-weight: 400;
  transition: color 0.2s;
}

.site-nav a:hover { color: #3C3489; }

/* ===== MAIN CONTENT ===== */
.page-content {
  max-width: 960px;
  margin: 0 auto;
  padding: 3rem 2rem;
}

/* ===== FOOTER ===== */
.site-footer {
  background: #ffffff;
  border-top: 1px solid #E8E6E0;
  padding: 1.4rem 3rem;
  text-align: center;
  font-size: 12.5px;
  color: #B4B2A9;
  margin-top: 4rem;
}
</style>

<body>

  <header class="site-header">
    <a class="site-title" href="{{ site.baseurl }}/">{{ site.title }}</a>
    <nav>
      <ul class="site-nav">
        {% for item in site.menu %}
        <li><a href="{{ site.baseurl }}{{ item.url }}">{{ item.title }}</a></li>
        {% endfor %}
      </ul>
    </nav>
  </header>

  <main class="page-content">
    {{ content }}
  </main>

  <footer class="site-footer">
    &copy; {{ site.time | date: "%Y" }} Syeda Faryal Fatima Naqvi &middot; All rights reserved
  </footer>

</body>
</html>
