<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang }}">

{% include head.html %}

<style>
  /* Particles Background */
  #particles-js {
    position: fixed;
    width: 100%;
    height: 100%;
    top: 0;
    left: 0;
    z-index: -1;
    background: #0f0c29;
    background: linear-gradient(to right, #24243e, #302b63, #0f0c29);
  }

  body {
    position: relative;
    z-index: 1;
  }
  /* Google Font Import - Modern & Clean */
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap');

/* Apply Font & Golden Color to Everything */
body {
  font-family: 'Poppins', sans-serif !important;
  color: #FFD700 !important;
}

h1, h2, h3, h4, h5, h6 {
  font-family: 'Poppins', sans-serif !important;
  color: #FFC300 !important;
  font-weight: 700 !important;
}

p, li, span, div {
  font-family: 'Poppins', sans-serif !important;
  color: #FFD700 !important;
}

a {
  color: #FFD700 !important;
  text-decoration: none !important;
}

a:hover {
  color: #ffffff !important;
  text-shadow: 0 0 8px #FFD700 !important;
}
  /* Hover Animation on Links */
a {
  position: relative;
  color: #FFD700 !important;
  text-decoration: none !important;
  transition: color 0.3s ease !important;
}

/* Underline slide-in effect */
a::after {
  content: '';
  position: absolute;
  width: 0%;
  height: 2px;
  bottom: -2px;
  left: 0;
  background-color: #FFD700;
  transition: width 0.3s ease;
  box-shadow: 0 0 8px #FFD700;
}

a:hover::after {
  width: 100%;
}

a:hover {
  color: #ffffff !important;
  text-shadow: 0 0 10px #FFD700, 0 0 20px #FFD700 !important;
  letter-spacing: 1px !important;
  transition: all 0.3s ease !important;
}
</style>

<body>

  <!-- Particles Background -->
  <div id="particles-js"></div>

  <header class="hover smooth">
    {% unless site.show_minimal and site.navigation and site.external %}
      <h1 {% if site.navigation and site.external %}class="full"{% endif %}><a href="{{ "/" | relative_url }}">{{ site.title | escape }}</a></h1>
    {% endunless %}
    {% include menu.html %}
  </header>

  {{ content }}

  {%- if site.footer -%}
  <footer class="hover">
    <div>{{ site.description }}</div>
  </footer>
  {%- endif -%}

  <!-- Particles JS -->
  <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
  <script>
    particlesJS("particles-js", {
      particles: {
        number: { value: 80, density: { enable: true, value_area: 800 } },
        color: { value: "#ffffff" },
        shape: { type: "circle" },
        opacity: { value: 0.5, random: true },
        size: { value: 3, random: true },
        line_linked: {
          enable: true,
          distance: 150,
          color: "#ffffff",
          opacity: 0.4,
          width: 1
        },
        move: {
          enable: true,
          speed: 3,
          direction: "none",
          random: false,
          straight: false,
          out_mode: "out"
        }
      },
      interactivity: {
        detect_on: "canvas",
        events: {
          onhover: { enable: true, mode: "repulse" },
          onclick: { enable: true, mode: "push" }
        },
        modes: {
          repulse: { distance: 100 },
          push: { particles_nb: 4 }
        }
      },
      retina_detect: true
    });
  </script>

</body>
</html>
