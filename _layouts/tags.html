---
layout: default
title: Tags
---
<div style="max-width: 800px; margin: 0 auto; padding: 2rem;">
  <h1 style="font-size: 2.5rem; margin-bottom: 2rem;">🏷️ Tags</h1>
  
  <div style="display: flex; flex-wrap: wrap; gap: 1rem;">
    {% for tag in site.tags %}
    <a href="#{{ tag[0] }}" style="
      text-decoration: none;
      background: rgba(167, 139, 250, 0.15);
      color: #a78bfa;
      padding: 0.5rem 1.2rem;
      border-radius: 999px;
      border: 1px solid rgba(167, 139, 250, 0.3);
      font-size: 0.95rem;
    ">
      #{{ tag[0] }} <span style="color: gray;">{{ tag[1].size }}</span>
    </a>
    {% endfor %}
  </div>

  <div style="margin-top: 3rem;">
    {% for tag in site.tags %}
    <div id="{{ tag[0] }}" style="margin-bottom: 2rem;">
      <h2 style="color: #a78bfa; font-size: 1.3rem;">#{{ tag[0] }}</h2>
      <ul style="list-style: none; padding: 0;">
        {% for post in tag[1] %}
        <li style="padding: 0.4rem 0; border-bottom: 1px solid rgba(255,255,255,0.05);">
          <a href="{{ site.baseurl }}{{ post.url }}" style="color: white; text-decoration: none;">
            {{ post.title }}
          </a>
          <span style="color: gray; font-size: 0.85rem; margin-left: 0.5rem;">
            {{ post.date | date: "%B %d, %Y" }}
          </span>
        </li>
        {% endfor %}
      </ul>
    </div>
    {% endfor %}
  </div>
</div>
