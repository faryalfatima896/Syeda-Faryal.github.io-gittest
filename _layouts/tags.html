---
layout: default
title: Tags
---
<div style="max-width: 800px; margin: 0 auto; padding: 2rem;">
  <h1 style="font-size: 2.5rem; margin-bottom: 2rem;">🏷️ Tags</h1>
  
  {% for tag in site.tags %}
  <div style="margin-bottom: 2rem; padding: 1.5rem; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1);">
    <h2 style="font-size: 1.4rem; margin-bottom: 1rem; color: #a78bfa;">
      #{{ tag[0] }} 
      <span style="font-size: 0.9rem; color: gray;">({{ tag[1].size }})</span>
    </h2>
    <ul style="list-style: none; padding: 0;">
      {% for post in tag[1] %}
      <li style="padding: 0.5rem 0; border-bottom: 1px solid rgba(255,255,255,0.05);">
        <a href="{{ site.baseurl }}{{ post.url }}" style="text-decoration: none; color: white; font-size: 1rem;">
          {{ post.title }}
        </a>
        <span style="color: gray; font-size: 0.85rem; margin-left: 1rem;">
          {{ post.date | date: "%B %d, %Y" }}
        </span>
      </li>
      {% endfor %}
    </ul>
  </div>
  {% endfor %}
</div>
